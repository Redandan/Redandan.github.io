<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>註冊 - Agora Market</title>
    <script src="legacy_auth_guard.js"></script>
    <link rel="stylesheet" href="register.092019a2e50b.css">
    <script src="register_ui.85f67ea1a50a.js"></script>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <a class="back-link" href="./#/login"><span aria-hidden="true">←</span><span data-i18n="backToLogin">返回登入</span></a>
            <button type="button" class="theme-toggle" onclick="toggleTheme()" title="切換主題" aria-label="切換主題"></button>
        </div>
        
        <div class="header">
            <div class="logo"><img src="icons/new_favicon/web-app-manifest-192x192.png" alt="" width="40" height="40"><span>Agora Market</span></div>
            <h1 class="title">
                <span data-i18n="title">加入 Agora Market</span>
            </h1>
            <p class="subtitle">
                <span data-i18n="subtitle">建立帳戶，開始探索市集</span>
            </p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">
                    <span data-i18n="username">用戶名</span>
                    <span class="required">*</span>
                </label>
                <input type="text" id="username" name="username" required 
                       data-i18n-placeholder="usernamePlaceholder" placeholder="請輸入用戶名（3-20個字符）">
                <div class="error-message" id="usernameError"></div>
            </div>

            <div class="form-group">
                <label for="email">
                    <span data-i18n="email">電子郵件</span>
                    <span class="required">*</span>
                </label>
                <input type="email" id="email" name="email" required 
                       data-i18n-placeholder="emailPlaceholder" placeholder="請輸入電子郵件地址">
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">
                    <span data-i18n="password">密碼</span>
                    <span class="required">*</span>
                </label>
                <input type="password" id="password" name="password" required 
                       data-i18n-placeholder="passwordPlaceholder" placeholder="請輸入密碼（8-128個字符）">
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    <span data-i18n="confirmPassword">確認密碼</span>
                    <span class="required">*</span>
                </label>
                <input type="password" id="confirmPassword" name="confirmPassword" required 
                       data-i18n-placeholder="confirmPlaceholder" placeholder="請再次輸入密碼">
                <div class="error-message" id="confirmPasswordError"></div>
            </div>

            <div class="form-group">
                <label for="promoCode">
                    <span data-i18n="promoCode">推廣碼（選填）</span>
                </label>
                <input type="text" id="promoCode" name="promoCode" 
                       data-i18n-placeholder="promoPlaceholder" placeholder="請輸入推廣碼（可選）">
            </div>

            <!-- Cloudflare Turnstile -->
            <div class="turnstile-container">
                <div class="turnstile-info">
                    <div class="info-text">
                        <span class="info-icon">🔒</span>
                        <span data-i18n="securityInfo">安全驗證（選填）：完成後，電子郵件可不填寫。</span>
                    </div>
                </div>
                <div id="turnstileLoading">
                    <span data-i18n="securityLoading">正在載入安全驗證…</span>
                </div>
                <div id="turnstileError" class="turnstile-error" role="status" aria-live="polite" style="display: none;"></div>
                <div class="turnstile-widget"
                     data-sitekey="0x4AAAAAAB6qPtHNy2aYT_6r" 
                     data-size="compact"
                     style="display: none;">
                </div>
                <div id="turnstileStatus" class="turnstile-status" style="display: none;">
                    <span class="status-icon">✅</span>
                    <span class="status-text">
                        <span data-i18n="securitySuccess">安全驗證成功，電子郵件可不填寫。</span>
                    </span>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <span id="btnText">
                    <span data-i18n="register">立即註冊</span>
                </span>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <span>
                        <span data-i18n="registering">註冊中…</span>
                    </span>
                </div>
            </button>
        </form>

        <div id="message" class="message"></div>

        <nav class="footer" aria-label="Legal links">
            <span data-i18n="agreementIntro">註冊即表示您同意</span><a href="./#/user-agreement" target="_blank" rel="noopener noreferrer" data-i18n="agreement">使用者協議</a><span data-i18n="agreementMiddle">，並確認已閱讀</span><a href="./#/privacy-policy" target="_blank" rel="noopener noreferrer" data-i18n="privacy">隱私政策</a><span data-i18n="agreementEnd">。</span>
        </nav>

        <!-- 註冊成功頁面已移除，現在直接跳轉到主頁 -->

    </div>

    <script>
        function registerText(key) { return window.AgoraRegisterUI.text(key); }
        // Turnstile 相關變量
        let turnstileToken = null;
        const turnstileLoadTimeoutMs = 15000;
        let turnstileAttempt = 0;
        let turnstileLoadTimer = null;
        let turnstileScript = null;
        let turnstileWidgetId = null;
        let turnstilePhase = 'idle';
        let userSourceHost = null;
        
        // 主題切換
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            const themeBtn = document.querySelector('.theme-toggle');
            window.AgoraRegisterUI.apply();
        }

        // 載入保存的主題
        function loadTheme() {
            const urlParams = new URLSearchParams(window.location.search);
            const themeFromUrl = urlParams.get('theme');
            
            let theme = 'light'; // 默認主題
            
            if (themeFromUrl && (themeFromUrl === 'light' || themeFromUrl === 'dark')) {
                theme = themeFromUrl;
            } else {
                theme = localStorage.getItem('theme') || 'light';
            }
            
            document.documentElement.setAttribute('data-theme', theme);
            const themeBtn = document.querySelector('.theme-toggle');
            if (themeBtn) {
                window.AgoraRegisterUI.apply();
            }
        }

        // 初始化主題
        loadTheme();

        // 初始化來源 host、主題和語言
        function initSourceHost() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // 使用當前頁面的origin作為默認值
            userSourceHost = window.location.origin;
            localStorage.setItem('agora_source_host', userSourceHost);
            
            // 處理主題參數
            const theme = urlParams.get('theme');
            if (theme && (theme === 'light' || theme === 'dark' || theme === 'system')) {
                let actualTheme = theme;
                if (theme === 'system') {
                    // 檢測系統主題偏好
                    actualTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', actualTheme);
                localStorage.setItem('theme', actualTheme);
                const themeBtn = document.querySelector('.theme-toggle');
                if (themeBtn) {
                    window.AgoraRegisterUI.apply();
                }
                console.log('Theme set from URL parameter:', theme, '->', actualTheme);
            }
            
            // 處理語言參數
            const lang = urlParams.get('lang');
            if (lang) {
                const normalized = window.AgoraRegisterUI.normalizeLocale(lang);
                document.documentElement.setAttribute('lang', normalized);
                localStorage.setItem('language', normalized);
                window.AgoraRegisterUI.apply();
                console.log('Language set from URL parameter:', lang);
            }
            
            // 處理來源參數（用於統計或特殊處理）
            const source = urlParams.get('source');
            if (source) {
                localStorage.setItem('agora_source', source);
                console.log('Source set from URL parameter:', source);
            }
        }

        // 獲取來源 host
        function getSourceHost() {
            return localStorage.getItem('agora_source_host') || window.location.origin;
        }

        // Registration may be entered from a protected buyer action. Only
        // preserve same-origin application paths; never redirect to a supplied
        // host after credentials have been created.
        function getSafeReturnTo() {
            const rawTarget = new URLSearchParams(window.location.search).get('returnTo');
            if (!rawTarget || !rawTarget.startsWith('/') || rawTarget.startsWith('//')) {
                return '/';
            }

            try {
                const target = new URL(rawTarget, window.location.origin);
                if (target.origin !== window.location.origin || target.pathname === '/login') {
                    return '/';
                }
                return target.pathname + target.search + target.hash;
            } catch (_) {
                return '/';
            }
        }

        function clearTurnstileLoad() {
            clearTimeout(turnstileLoadTimer);
            turnstileLoadTimer = null;
            if (turnstileScript) {
                turnstileScript.onload = null;
                turnstileScript.onerror = null;
                turnstileScript.remove();
                turnstileScript = null;
            }
        }

        function removeTurnstileWidget() {
            if (turnstileWidgetId !== null && window.turnstile) {
                try { window.turnstile.remove(turnstileWidgetId); } catch (_) { /* Already removed. */ }
            }
            turnstileWidgetId = null;
        }

        // A stalled third-party script must not delay this page's own deadline
        // or its existing email registration alternative.
        function initTurnstile() {
            const attempt = ++turnstileAttempt;
            clearTurnstileLoad();
            removeTurnstileWidget();
            turnstileToken = null;
            turnstilePhase = 'loading';
            document.getElementById('turnstileLoading').style.display = 'block';
            document.getElementById('turnstileError').style.display = 'none';
            document.getElementById('turnstileStatus').style.display = 'none';
            document.querySelector('.turnstile-widget').style.display = 'none';
            hideTurnstileRefreshButton();
            const fail = () => {
                if (attempt === turnstileAttempt) showTurnstileError(registerText('securityUnavailable'));
            };
            const render = () => {
                if (attempt !== turnstileAttempt) return;
                if (typeof window.turnstile?.render !== 'function') { fail(); return; }
                clearTurnstileLoad();
                try {
                    const widget = document.querySelector('.turnstile-widget');
                    widget.style.display = 'block';
                    const current = callback => value => {
                        if (attempt === turnstileAttempt) callback(value);
                    };
                    turnstileWidgetId = window.turnstile.render(widget, {
                        sitekey: widget.dataset.sitekey,
                        size: 'compact',
                        callback: current(onTurnstileSuccess),
                        'error-callback': current(onTurnstileError),
                        'expired-callback': current(onTurnstileExpired)
                    });
                    if (attempt !== turnstileAttempt) { removeTurnstileWidget(); return; }
                    document.getElementById('turnstileLoading').style.display = 'none';
                    if (turnstilePhase === 'loading') turnstilePhase = 'ready';
                } catch (_) { fail(); }
            };
            turnstileLoadTimer = setTimeout(fail, turnstileLoadTimeoutMs);
            if (window.turnstile) {
                render();
            } else {
                const script = document.createElement('script');
                turnstileScript = script;
                script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
                script.async = true;
                script.onload = render;
                script.onerror = fail;
                document.head.appendChild(script);
            }
        }

        window.addEventListener('pagehide', () => {
            ++turnstileAttempt;
            clearTurnstileLoad();
            removeTurnstileWidget();
            turnstileToken = null;
            turnstilePhase = 'idle';
        });
        window.addEventListener('pageshow', event => {
            if (event.persisted) initTurnstile();
        });

        // Turnstile 成功回調
        function onTurnstileSuccess(token) {
            clearTurnstileLoad();
            turnstilePhase = 'verified';
            turnstileToken = token;
            document.getElementById('turnstileLoading').style.display = 'none';
            document.getElementById('turnstileError').style.display = 'none';
            document.getElementById('turnstileStatus').style.display = 'flex';
            document.querySelector('.turnstile-widget').style.display = 'none';
            
            // 隱藏刷新按鈕
            hideTurnstileRefreshButton();
            
            console.log('Turnstile verification successful');
        }

        // Turnstile 錯誤回調
        function onTurnstileError(error) {
            console.error(
                'Turnstile verification failed: errorType=' +
                ((error && error.name) || 'UnknownError')
            );
            turnstileToken = null;
            showTurnstileError(registerText('securityFailed'));
        }

        // Turnstile 過期回調
        function onTurnstileExpired() {
            console.log('Turnstile verification expired');
            turnstileToken = null;
            showTurnstileError(registerText('securityExpired'));
        }

        // 顯示 Turnstile 錯誤並提供刷新選項
        function showTurnstileError(message) {
            ++turnstileAttempt;
            clearTurnstileLoad();
            removeTurnstileWidget();
            turnstilePhase = 'error';
            turnstileToken = null;
            document.getElementById('turnstileLoading').style.display = 'none';
            document.querySelector('.turnstile-widget').style.display = 'none';
            document.getElementById('turnstileStatus').style.display = 'none';
            const error = document.getElementById('turnstileError');
            error.textContent = message;
            error.style.display = 'block';
            showTurnstileRefreshButton();
            // The email alternative stays available while idle. Only the form's
            // setButtonState owns submission locking, including during a retry.
        }

        // 顯示 Turnstile 刷新按鈕
        function showTurnstileRefreshButton() {
            let refreshBtn = document.getElementById('turnstileRefreshBtn');
            if (!refreshBtn) {
                refreshBtn = document.createElement('button');
                refreshBtn.id = 'turnstileRefreshBtn';
                refreshBtn.type = 'button';
                refreshBtn.className = 'turnstile-refresh-btn';
                refreshBtn.textContent = registerText('refreshVerification');
                refreshBtn.onclick = refreshTurnstile;
                
                const turnstileContainer = document.querySelector('.turnstile-container');
                turnstileContainer.appendChild(refreshBtn);
            }
            refreshBtn.style.display = 'block';
        }

        // 隱藏 Turnstile 刷新按鈕
        function hideTurnstileRefreshButton() {
            const refreshBtn = document.getElementById('turnstileRefreshBtn');
            if (refreshBtn) {
                refreshBtn.style.display = 'none';
            }
        }

        // 刷新 Turnstile
        function refreshTurnstile() {
            initTurnstile();
        }

        // 顯示消息
        function showMessage(message, type = 'info') {
            const messageEl = document.getElementById('message');
            messageEl.textContent = message;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
            
            // 3秒後自動隱藏
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 3000);
        }

        // 顯示錯誤
        function showError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const errorEl = document.getElementById(fieldId + 'Error');
            
            field.classList.add('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        // 清除錯誤
        function clearError(fieldId) {
            const field = document.getElementById(fieldId);
            const errorEl = document.getElementById(fieldId + 'Error');
            
            field.classList.remove('error');
            errorEl.style.display = 'none';
        }

        // 清除所有錯誤
        function clearAllErrors() {
            clearError('username');
            clearError('email');
            clearError('password');
            clearError('confirmPassword');
        }

        // 設置按鈕狀態
        function setButtonState(loading) {
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const loadingEl = document.getElementById('loading');
            
            if (loading) {
                btn.disabled = true;
                btnText.style.display = 'none';
                loadingEl.style.display = 'flex';
            } else {
                btn.disabled = false;
                btnText.style.display = 'block';
                loadingEl.style.display = 'none';
            }
        }

        // 顯示註冊成功頁面（已整合到流程1，此函數不再使用）
        function showRegistrationSuccess(response) {
            // 此函數已被流程1替代，不再使用
            console.log('showRegistrationSuccess 函數已被流程1替代');
        }

        // 錯誤代碼映射（支持多語言）
        const ERROR_MESSAGES = {
            'USERNAME_EXISTS': {
                'zh-TW': '用戶名已存在，請選擇其他用戶名',
                'zh-CN': '用户名已存在，请选择其他用户名',
                'en': 'Username already exists, please choose another username',
                'ja': 'ユーザー名は既に存在します'
            },
            'EMAIL_EXISTS': {
                'zh-TW': '郵箱已存在，請使用其他郵箱',
                'zh-CN': '邮箱已存在，请使用其他邮箱',
                'en': 'Email already exists, please use another email',
                'ja': 'メールアドレスは既に存在します'
            },
            'PASSWORD_MISMATCH': {
                'zh-TW': '密碼與確認密碼不一致',
                'zh-CN': '密码与确认密码不一致',
                'en': 'Password and confirm password do not match',
                'ja': 'パスワードと確認パスワードが一致しません'
            },
            // 驗證錯誤代碼
            'USERNAME_SIZE_INVALID': {
                'zh-TW': '用戶名長度必須在3-20個字符之間',
                'zh-CN': '用户名长度必须在3-20个字符之间',
                'en': 'Username must be between 3 and 20 characters',
                'ja': 'ユーザー名は3〜20文字である必要があります'
            },
            'USERNAME_REQUIRED': {
                'zh-TW': '用戶名不能為空',
                'zh-CN': '用户名不能为空',
                'en': 'Username is required',
                'ja': 'ユーザー名は必須です'
            },
            'EMAIL_FORMAT_INVALID': {
                'zh-TW': '郵箱格式不正確',
                'zh-CN': '邮箱格式不正确',
                'en': 'Invalid email format',
                'ja': 'メールアドレスの形式が正しくありません'
            },
            'EMAIL_REQUIRED': {
                'zh-TW': '郵箱不能為空',
                'zh-CN': '邮箱不能为空',
                'en': 'Email is required',
                'ja': 'メールアドレスは必須です'
            },
            'PASSWORD_SIZE_INVALID': {
                'zh-TW': '密碼長度必須在8-128個字符之間',
                'zh-CN': '密码长度必须在8-128个字符之间',
                'en': 'Password must be between 8 and 128 characters',
                'ja': 'パスワードは8〜128文字である必要があります'
            },
            'PASSWORD_REQUIRED': {
                'zh-TW': '密碼不能為空',
                'zh-CN': '密码不能为空',
                'en': 'Password is required',
                'ja': 'パスワードは必須です'
            },
            'CONFIRM_PASSWORD_REQUIRED': {
                'zh-TW': '確認密碼不能為空',
                'zh-CN': '确认密码不能为空',
                'en': 'Confirm password is required',
                'ja': '確認パスワードは必須です'
            }
        };

        // 獲取當前語言
        function getCurrentLanguage() {
            return document.documentElement.getAttribute('lang') || 'zh-TW';
        }

        // 獲取錯誤信息（支持多語言）
        function getErrorMessage(errorCode) {
            const lang = getCurrentLanguage();
            const messages = ERROR_MESSAGES[errorCode];
            
            if (messages && messages[lang]) {
                return messages[lang];
            }
            
            // 如果沒有對應語言的翻譯，返回默認語言
            return window.AgoraRegisterUI.errorMessage(errorCode) || (messages ? messages['en'] : registerText('registrationFailed'));
        }

        // 聚焦並高亮特定欄位
        function focusAndHighlightField(fieldId, message) {
            const field = document.getElementById(fieldId);
            const errorEl = document.getElementById(fieldId + 'Error');
            
            if (field && errorEl) {
                // 聚焦到有問題的欄位
                field.focus();
                
                // 高亮欄位（添加錯誤樣式）
                field.classList.add('error');
                
                // 顯示錯誤信息
                errorEl.textContent = message;
                errorEl.style.display = 'block';
                
                // 滾動到錯誤欄位
                field.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                // 3秒後自動清除錯誤樣式（但保留錯誤信息）
                setTimeout(() => {
                    field.classList.remove('error');
                }, 3000);
            }
        }

        // 處理註冊失敗 - 多語言版本
        function handleRegistrationError(error) {
                console.error(
                    'Registration failed: errorType=' +
                    ((error && error.name) || 'UnknownError')
                );
            
            // 清除之前的錯誤
            clearAllErrors();
            
            if (error.errorCode && error.field) {
                // 使用錯誤代碼和欄位信息
                const message = getErrorMessage(error.errorCode);
                focusAndHighlightField(error.field, message);
            } else if (error.message) {
                // 檢查是否為 Turnstile 相關錯誤
                if (error.message.includes('安全驗證失敗') || error.message.includes('Token 已使用過')) {
                    showTurnstileError(error.message);
                } else {
                    // 兼容舊格式，顯示通用錯誤
                    showMessage(error.message, 'error');
                }
            } else {
                showMessage(registerText('checkInputs'), 'error');
            }
        }

        // 表單提交處理 - 使用 fetch 但支持重定向
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!window.AgoraLegacyAuth || !window.AgoraLegacyAuth.allows()) {
                showMessage(registerText('sessionChanged'), 'warning');
                return;
            }
            
            console.log('🎉 [SUCCESS] Register form submit event triggered');
            console.log('🔍 [DEBUG] Starting registration process...');
            
            // 清除之前的錯誤
            clearAllErrors();
            
            // 獲取表單數據
            const formData = new FormData(this);
            const registerData = {
                username: formData.get('username'),
                email: formData.get('email'),
                password: formData.get('password'),
                confirmPassword: formData.get('confirmPassword'),
                promoCode: formData.get('promoCode') || null,
                turnstileToken: turnstileToken
            };
            
            // 基本驗證
            if (!registerData.username || !registerData.password) {
                showMessage(registerText('usernamePasswordRequired'), 'error');
                return;
            }
            
            if (registerData.password !== registerData.confirmPassword) {
                showMessage(registerText('passwordMismatch'), 'error');
                return;
            }
            
            // Turnstile 驗證（如果沒有提供 email）
            if (!turnstileToken && (!registerData.email || registerData.email.trim() === '')) {
                showMessage(registerText('securityOrEmail'), 'error');
                return;
            }
            
            // 設置載入狀態
            setButtonState(true);
            
            try {
                // 發送註冊請求
                window.AgoraLegacyAuth.requireActive();
                const response = await fetch('https://agoramarketapi.purrtechllc.com/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify(registerData),
                    signal: AbortSignal.timeout(30000) // 30秒超時
                });
                
                window.AgoraLegacyAuth.requireActive();
                // 處理JSON響應
                console.log('🔍 [DEBUG] API 響應狀態:', response.status);
                
                const result = await response.json();
                window.AgoraLegacyAuth.requireActive();
                console.log('🔍 [DEBUG] API 響應已解析:', {
                    success: result?.success === true,
                    loginResultPresent: !!result?.loginResult
                });
                
                if (response.ok && result.success) {
                    // 註冊成功，保存JWT並跳轉到主頁
                    console.log('🎉 [SUCCESS] 註冊成功，開始保存JWT並跳轉到主頁');
                    
                    // 保存JWT到localStorage
                    console.log('🔍 [DEBUG] 開始提取 JWT 信息...');
                    
                    // 檢查 loginResult 是否存在
                    if (result.loginResult) {
                        console.log('✅ [SUCCESS] 找到 loginResult 對象');
                        
                        // 提取 access token
                        const actualToken = result.loginResult.token;
                        if (actualToken) {
                            window.AgoraLegacyAuth.setItem('access_token', actualToken);
                            console.log('✅ [SUCCESS] Access token 已保存到 localStorage:', {
                                present: true
                            });
                        } else {
                            console.error('❌ [ERROR] loginResult 中沒有找到 token');
                        }
                        
                        // 提取 refresh token
                        const actualRefreshToken = result.loginResult.refreshToken;
                        if (actualRefreshToken) {
                            window.AgoraLegacyAuth.setItem('refresh_token', actualRefreshToken);
                            console.log('✅ [SUCCESS] Refresh token 已保存到 localStorage:', {
                                present: true
                            });
                        } else {
                            console.error('❌ [ERROR] loginResult 中沒有找到 refreshToken');
                        }
                        
                        // 提取用戶信息
                        const userInfo = result.loginResult.userInfo;
                        if (userInfo) {
                            window.AgoraLegacyAuth.setItem('user_info', JSON.stringify(userInfo));
                            console.log('✅ [SUCCESS] User info 已保存到 localStorage:', {
                                present: true
                            });
                        } else {
                            console.error('❌ [ERROR] loginResult 中沒有找到 userInfo');
                        }
                        
                        // 保存額外的用戶信息
                        if (result.loginResult.userId) {
                            window.AgoraLegacyAuth.setItem('user_id', result.loginResult.userId.toString());
                            console.log('✅ [SUCCESS] User ID 已保存到 localStorage:', {
                                present: true
                            });
                        }
                        
                        if (result.loginResult.username) {
                            window.AgoraLegacyAuth.setItem('username', result.loginResult.username);
                            console.log('✅ [SUCCESS] Username 已保存到 localStorage:', {
                                present: true
                            });
                        }
                    } else {
                        console.error('❌ [ERROR] API 響應中沒有找到 loginResult 對象');
                    }
                        
                    // 驗證保存結果
                    const savedToken = localStorage.getItem('access_token');
                    const savedRefreshToken = localStorage.getItem('refresh_token');
                    const savedUserInfo = localStorage.getItem('user_info');
                    const savedUserId = localStorage.getItem('user_id');
                    const savedUsername = localStorage.getItem('username');
                    
                    console.log('🔍 [DEBUG] 驗證保存結果:');
                    console.log('  - access_token:', savedToken ? '✅ 已保存' : '❌ 未保存');
                    console.log('  - refresh_token:', savedRefreshToken ? '✅ 已保存' : '❌ 未保存');
                    console.log('  - user_info:', savedUserInfo ? '✅ 已保存' : '❌ 未保存');
                    console.log('  - user_id:', savedUserId ? '✅ 已保存' : '❌ 未保存');
                    console.log('  - username:', savedUsername ? '✅ 已保存' : '❌ 未保存');
                    
                    // 顯示所有 localStorage 鍵
                    const allKeys = Object.keys(localStorage);
                    console.log('🔍 [DEBUG] localStorage 中的所有鍵:', allKeys);
                    
                    window.AgoraLegacyAuth.requireActive();
                    // 發送註冊成功日誌到 Flutter 應用
                    try {
                        if (window.parent && window.parent.postMessage) {
                            window.parent.postMessage({
                                type: 'register_success',
                                message: 'Registration successful, JWT saved',
                                data: {
                                    hasToken: !!savedToken,
                                    hasRefreshToken: !!savedRefreshToken,
                                    hasUserInfo: !!savedUserInfo,
                                    hasUserId: !!savedUserId,
                                    hasUsername: !!savedUsername,
                                    localStorageKeys: Object.keys(localStorage)
                                }
                            }, '*');
                        }
                    } catch (e) {
                        console.warn('無法發送註冊成功日誌到 Flutter 應用:', e);
                    }
                    
                    // 確認 JWT 已保存後再跳轉
                    console.log('🔍 [DEBUG] 開始驗證 JWT 保存狀態...');
                    
                    // 驗證 JWT 是否真的保存到 localStorage
                    const verifyToken = localStorage.getItem('access_token');
                    const verifyRefreshToken = localStorage.getItem('refresh_token');
                    const verifyUserInfo = localStorage.getItem('user_info');
                    
                    console.log('🔍 [DEBUG] JWT 保存驗證結果:');
                    console.log('  - access_token present:', !!verifyToken);
                    console.log('  - refresh_token present:', !!verifyRefreshToken);
                    console.log('  - user_info present:', !!verifyUserInfo);
                    
                    if (verifyToken) {
                        console.log('✅ [SUCCESS] JWT 驗證成功，準備跳轉');
                        
                        // 獲取來源 host
                        const sourceHost = getSourceHost();
                        console.log('🔍 [DEBUG] 來源 host:', sourceHost);
                        
                        // Restore the protected buyer action when registration
                        // was entered with a validated local return target.
                        const targetUrl = sourceHost + getSafeReturnTo();
                        console.log('🚀 [INFO] 跳轉目標 URL:', targetUrl);
                        
                        // 添加短暫延遲，確保所有操作完成
                        setTimeout(() => {
                            if (!window.AgoraLegacyAuth.allows()) {
                                showMessage(registerText('sessionChanged'), 'warning');
                                return;
                            }
                            console.log('🚀 [INFO] 執行跳轉到:', targetUrl);
                            window.location.href = targetUrl;
                        }, 200);
                    } else {
                        console.error('❌ [ERROR] JWT 保存驗證失敗，無法跳轉');
                        showMessage(registerText('sessionSaveFailed'), 'warning');
                    }
                    return;
                } else {
                    handleRegistrationError(result);
                }
                
            } catch (error) {
                if (error && error.name === 'LegacyAuthRetiredError') {
                    showMessage(registerText('sessionChanged'), 'warning');
                    return;
                }
                console.error(
                    'Network error: errorType=' +
                    ((error && error.name) || 'UnknownError')
                );
                showMessage(registerText('networkError'), 'error');
            } finally {
                setButtonState(false);
            }
        });

        // 處理URL參數（已整合到流程1，此函數不再使用）
        function handleUrlParams() {
            // 此函數已被流程1替代，不再使用
            console.log('handleUrlParams 函數已被流程1替代');
        }

        // 為每個輸入欄位添加事件監聽器
        function initFieldEventListeners() {
            const fields = ['username', 'email', 'password', 'confirmPassword'];
            
            fields.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                if (field) {
                    field.addEventListener('input', function() {
                        // 用戶開始輸入時清除該欄位的錯誤
                        clearError(fieldId);
                    });
                    
                    field.addEventListener('focus', function() {
                        // 聚焦時也清除錯誤樣式
                        field.classList.remove('error');
                    });
                }
            });
        }

        // 頁面載入時初始化
        window.addEventListener('DOMContentLoaded', function() {
            console.log('🎉 [SUCCESS] Register page DOMContentLoaded event triggered');
            console.log('🔍 [DEBUG] Register page fully loaded');
            
            // 發送日誌到 Flutter 應用
            try {
                if (window.parent && window.parent.postMessage) {
                    window.parent.postMessage({
                        type: 'register_page_log',
                        message: 'Register page loaded successfully'
                    }, '*');
                }
            } catch (e) {
                console.warn('無法發送日誌到 Flutter 應用:', e);
            }
            
            // 初始化來源 host
            initSourceHost();
            
            // URL參數處理已整合到流程1，不再需要
            
            // 初始化 Turnstile
            initTurnstile();
            
            // 初始化欄位事件監聽器
            initFieldEventListeners();
            
            console.log('✅ [SUCCESS] Registration page initialization completed');
        });
    </script>
</body>
</html>
