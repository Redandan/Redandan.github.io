<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>離線 - Agora Market</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1A1A1A 0%, #2D2D2D 100%);
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
        }
        
        .icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 32px;
            background: linear-gradient(135deg, #AA95DC 0%, #6A4C93 100%);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            box-shadow: 0 12px 40px rgba(170, 149, 220, 0.4);
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(45deg, #ffffff, #f0f0f0);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 32px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .button {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, #AA95DC 0%, #6A4C93 100%);
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(170, 149, 220, 0.3);
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(170, 149, 220, 0.4);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .tips {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .tips h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .tips ul {
            list-style: none;
            text-align: left;
        }
        
        .tips li {
            padding: 8px 0;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            padding-left: 24px;
            position: relative;
        }
        
        .tips li:before {
            content: "•";
            position: absolute;
            left: 8px;
            color: #AA95DC;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>您目前處於離線狀態</h1>
        <p>請檢查您的網路連接，然後重新載入頁面。</p>
        <a href="/" class="button" onclick="window.location.reload(); return false;">重新載入</a>
        
        <div class="tips">
            <h2>提示</h2>
            <ul>
                <li>檢查您的 Wi-Fi 或行動數據連線</li>
                <li>確認您的裝置已連接到網路</li>
                <li>嘗試重新載入頁面</li>
                <li>部分功能在離線時仍可使用</li>
            </ul>
        </div>
    </div>
    
    <script>
        // 檢測網路狀態
        window.addEventListener('online', function() {
            window.location.reload();
        });
        
        // 定期檢查網路狀態
        setInterval(function() {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 5000);
    </script>
</body>
</html>
