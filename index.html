<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="agora-pages-role" content="legacy-redirect">
    <meta name="agora-target-release" content="e60adb5af0c1ca63eeb27468734a5f6516572dcb">
    <meta http-equiv="refresh" content="2;url=https://agoramarket.purrtechllc.com/">
    <title>正在前往新版 AgoraMarket</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f4f7fb; color: #172033; }
      main { width: min(34rem, calc(100% - 2rem)); padding: 2rem; box-sizing: border-box; border: 1px solid #dfe6f1; border-radius: 1.25rem; background: #fff; box-shadow: 0 1rem 3rem rgb(33 52 87 / 10%); text-align: center; }
      h1 { margin: 0 0 .75rem; font-size: clamp(1.45rem, 5vw, 2rem); }
      p { margin: 0 0 1.25rem; color: #536078; line-height: 1.65; }
      a { display: inline-block; padding: .8rem 1.15rem; border-radius: .8rem; background: #2457d6; color: #fff; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>AgoraMarket 已更新</h1>
      <p>這個舊版測試入口已停用，正在帶你前往目前的 V2 網站。</p>
      <a id="continue" href="https://agoramarket.purrtechllc.com/">立即進入新版</a>
    </main>
    <script>
      (() => {
        const legacyPath = location.pathname === "/index.html" ? "/" : location.pathname;
        const destination = new URL(legacyPath + location.search + location.hash, "https://agoramarket.purrtechllc.com");
        document.querySelector("#continue").href = destination.href;

        const cleanup = async () => {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.allSettled(registrations.map((registration) => registration.unregister()));
          }
          if ("caches" in window) {
            const names = await caches.keys();
            await Promise.allSettled(names.map((name) => caches.delete(name)));
          }
        };

        Promise.race([
          cleanup(),
          new Promise((resolve) => setTimeout(resolve, 1200)),
        ]).finally(() => location.replace(destination.href));
      })();
    </script>
  </body>
</html>
