    // Request the largest available Telegram Mini App viewport before Flutter
    // starts. iOS can lock the first layout pass to a half-height sheet if this
    // waits until the Dart bundle is loaded.
    (function () {
      'use strict';

      function hasTelegramVersion(webApp, version) {
        try {
          return typeof webApp.isVersionAtLeast === 'function' &&
            webApp.isVersionAtLeast(version) === true;
        } catch (_) {
          return false;
        }
      }

      function isMobileTelegramWebApp(webApp) {
        try {
          var platform = String(webApp && webApp.platform || '').toLowerCase();
          if (platform === 'ios' || platform === 'android' || platform === 'android_x') {
            return true;
          }
          if (platform === 'tdesktop' || platform === 'weba' || platform === 'webk' ||
              platform === 'macos' || platform === 'windows' || platform === 'linux') {
            return false;
          }
        } catch (_) {}
        try {
          var ua = String(navigator.userAgent || '');
          if (/Android|iPhone|iPad|iPod|Mobile/i.test(ua)) return true;
        } catch (_) {}
        try {
          return window.matchMedia &&
            window.matchMedia('(pointer: coarse) and (max-width: 900px)').matches;
        } catch (_) {
          return false;
        }
      }

      function readActiveTelegramDesktopEntryContext() {
        var stores = [];
        try { stores.push(sessionStorage); } catch (_) {}
        try { stores.push(localStorage); } catch (_) {}
        for (var i = 0; i < stores.length; i += 1) {
          try {
            var rawContext = stores[i].getItem('_tg_store_entry_context');
            if (!rawContext) continue;
            var context = JSON.parse(rawContext);
            var expiresAt = Number(context && context.expiresAt || 0);
            if (expiresAt <= Date.now()) {
              stores[i].removeItem('_tg_store_entry_context');
              continue;
            }
            if (context && context.desktop === true) return context;
          } catch (_) {
            try { stores[i].removeItem('_tg_store_entry_context'); } catch (_) {}
          }
        }
        return null;
      }

      function isDesktopTelegramWebApp(webApp) {
        try {
          var platform = String(webApp && webApp.platform || '').toLowerCase();
          if (platform === 'tdesktop' || platform === 'windows' ||
              platform === 'macos' || platform === 'linux') return true;
        } catch (_) {}
        return readActiveTelegramDesktopEntryContext() != null;
      }

      function validViewportLength(value) {
        var number = Number(value || 0);
        return Number.isFinite(number) && number > 0 && number <= 10000
          ? number
          : 0;
      }

      function smallestViewportLength(first, second) {
        if (first > 0 && second > 0) return Math.min(first, second);
        return first || second || 0;
      }

      function isNativeWindowsTelegram(webApp) {
        try {
          var platform = String(webApp && webApp.platform || '').toLowerCase();
          var ua = String(navigator.userAgent || '');
          return (platform === 'tdesktop' || platform === 'windows') &&
            /Windows NT/i.test(ua);
        } catch (_) {
          return false;
        }
      }

      function telegramWindowsWebView2Bounds(webApp, width, height) {
        if (!isNativeWindowsTelegram(webApp)) return null;
        var dpr = validViewportLength(window.devicePixelRatio);
        var availableHeight = validViewportLength(
          window.screen && window.screen.availHeight
        );
        var isHighDpiWindowsWebView = dpr > 1 && availableHeight > 0;
        var hasScaledWidth = width > 768;
        var hasScaledHeight = height > 900;
        if (!isHighDpiWindowsWebView || (!hasScaledWidth && !hasScaledHeight)) {
          return null;
        }

        // Telegram Desktop 7.0.9 / WebView2 151 can expose its scaled outer
        // surface (1098x1235 at 175% DPI) while the embedded pane is only about
        // 675x730. Either axis can be wrong independently: Telegram can report
        // the correct 675px width together with a stale 1142px height. Cap only
        // the scaled axis so the compact bottom navigation remains visible.
        return {
          width: hasScaledWidth ? Math.min(width, 675) : width,
          height: hasScaledHeight ? Math.min(height, 720) : height
        };
      }

      function resolveTelegramDesktopVisibleBounds(webApp, entryContext) {
        var visualViewport = window.visualViewport;
        var useLocalOrigin = isNativeWindowsTelegram(webApp);
        var liveVisualWidth = validViewportLength(
          visualViewport && visualViewport.width
        );
        var liveVisualHeight = validViewportLength(
          visualViewport && visualViewport.height
        );
        var liveStableHeight = validViewportLength(
          webApp && webApp.viewportStableHeight
        );

        var width = liveVisualWidth || validViewportLength(
          entryContext && entryContext.visualViewportWidth
        );
        var height = smallestViewportLength(
          liveVisualHeight,
          liveStableHeight
        ) || validViewportLength(
          entryContext && entryContext.visualViewportHeight
        ) || validViewportLength(
          entryContext && entryContext.viewportStableHeight
        );
        var windowsBounds = telegramWindowsWebView2Bounds(
          webApp,
          width,
          height
        );
        if (windowsBounds) {
          width = windowsBounds.width;
          height = windowsBounds.height;
        }

        return {
          width: width,
          height: height,
          // Telegram Desktop on Windows can expose the native panel's
          // screen-space origin through VisualViewport. Reapplying that value
          // inside the WebView shifts Flutter a second time and can move half
          // of the storefront beyond the right edge. The document origin is
          // already local to the embedded pane, so keep it at (0, 0).
          left: useLocalOrigin ? 0 : validViewportLength(
            visualViewport && visualViewport.offsetLeft
          ),
          top: useLocalOrigin ? 0 : validViewportLength(
            visualViewport && visualViewport.offsetTop
          )
        };
      }

      function setViewportProperty(name, value) {
        if (value > 0) {
          document.documentElement.style.setProperty(name, value + 'px');
        } else {
          document.documentElement.style.removeProperty(name);
        }
      }

      function syncTelegramDesktopViewportClass(webApp) {
        var isDesktopWebApp = isDesktopTelegramWebApp(webApp);
        var entryContext = readActiveTelegramDesktopEntryContext();
        var visibleBounds = resolveTelegramDesktopVisibleBounds(
          webApp,
          entryContext
        );
        document.documentElement.classList.toggle(
          'agora-telegram-desktop-mini-app',
          isDesktopWebApp
        );
        if (isDesktopWebApp) {
          setViewportProperty(
            '--agora-telegram-desktop-visible-width',
            visibleBounds.width
          );
          setViewportProperty(
            '--agora-telegram-desktop-visible-height',
            visibleBounds.height
          );
          setViewportProperty(
            '--agora-telegram-desktop-visible-left',
            visibleBounds.left
          );
          setViewportProperty(
            '--agora-telegram-desktop-visible-top',
            visibleBounds.top
          );
        } else {
          [
            '--agora-telegram-desktop-visible-width',
            '--agora-telegram-desktop-visible-height',
            '--agora-telegram-desktop-visible-left',
            '--agora-telegram-desktop-visible-top'
          ].forEach(function (name) {
            document.documentElement.style.removeProperty(name);
          });
        }
        window.__agoraTelegramDesktopViewportConstrained = isDesktopWebApp;
      }

      function requestViewport(reason) {
        try {
          var webApp = window.Telegram && window.Telegram.WebApp;
          if (!webApp) return;
          syncTelegramDesktopViewportClass(webApp);
          if (typeof webApp.ready === 'function') webApp.ready();
          var isMobileWebApp = isMobileTelegramWebApp(webApp);
          if (isMobileWebApp && typeof webApp.expand === 'function') {
            webApp.expand();
          }
          if (hasTelegramVersion(webApp, '7.7') &&
              typeof webApp.disableVerticalSwipes === 'function') {
            webApp.disableVerticalSwipes();
          }
          if (isMobileWebApp &&
              hasTelegramVersion(webApp, '8.0') &&
              typeof webApp.requestFullscreen === 'function') {
            webApp.requestFullscreen();
          }
          window.__agoraTelegramViewportRequested = reason;
        } catch (_) {}
      }

      requestViewport('index-startup');
      setTimeout(function () { requestViewport('index-retry-250ms'); }, 250);
      setTimeout(function () { requestViewport('index-retry-900ms'); }, 900);

      try {
        if (window.visualViewport &&
            typeof window.visualViewport.addEventListener === 'function') {
          window.visualViewport.addEventListener('resize', function () {
            requestViewport('visual-viewport-resize');
          });
          window.visualViewport.addEventListener('scroll', function () {
            requestViewport('visual-viewport-scroll');
          });
        }
        window.addEventListener('resize', function () {
          requestViewport('window-resize');
        });
        var liveWebApp = window.Telegram && window.Telegram.WebApp;
        if (liveWebApp && typeof liveWebApp.onEvent === 'function') {
          liveWebApp.onEvent('viewportChanged', function (event) {
            if (event && event.isStateStable === false) return;
            requestViewport('telegram-stable-viewport');
          });
          liveWebApp.onEvent('activated', function () {
            requestViewport('telegram-activated');
          });
        }
      } catch (_) {}
    })();
  </script>

    // Early global error diagnostics to capture exact source of prod-only failures
    (function(){
      if (window.__errorHooksInstalled) return; window.__errorHooksInstalled = true;
      window.addEventListener('error', function(event){
        try {
          var error = event && event.error;
          console.error('[FATAL_ERROR]', {
            errorName: error && error.name || 'Error',
            messagePresent: !!(event && event.message),
            stackPresent: !!(error && error.stack),
            sourcePresent: !!(event && event.filename)
          });
        } catch(_) {}
      });
      window.addEventListener('unhandledrejection', function(event){
        try {
          var reason = event && event.reason;
          console.error('[UNHANDLED_REJECTION]', {
            reasonType: reason && reason.constructor && reason.constructor.name || typeof reason,
            messagePresent: !!(reason && reason.message),
            stackPresent: !!(reason && reason.stack)
          });
        } catch(_) {}
      });
      console.log('[DIAG] index.html diagnostics installed, version meta:', (document.querySelector('meta[name="version"]')||{}).content);
    })();

  </script>
  
  <script>
    (function () {
      'use strict';

      function isIOSStandaloneStartup() {
        try {
          var ua = navigator.userAgent || '';
          var maxTouchPoints = Number(navigator.maxTouchPoints || 0);
          var isIOS = /iPad|iPhone|iPod/.test(ua) ||
            (/Macintosh/.test(ua) && maxTouchPoints > 1);
          if (!isIOS) return false;
          return window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches ||
            window.matchMedia('(display-mode: minimal-ui)').matches ||
            window.navigator.standalone === true;
        } catch (_) {
          return false;
        }
      }

      function revealStartupLoading(reason) {
        var root = document.documentElement;
        if (!root) return;
        root.classList.add('agora-startup-layout-ready');
        root.classList.remove('agora-startup-layout-pending');
        window.__AGORA_STARTUP_REVEAL_REASON = reason || 'ready';
      }

      window.__AGORA_REVEAL_STARTUP_LOADING = revealStartupLoading;

      if (isIOSStandaloneStartup()) {
        document.documentElement.classList.add(
          'agora-ios-standalone-startup',
          'agora-startup-layout-pending'
        );
        window.__AGORA_STARTUP_REVEAL_REASON = 'pending';
        setTimeout(function () {
          revealStartupLoading('fallback-timeout');
        }, 1800);
      } else {
        revealStartupLoading('not-ios-standalone');
      }
    })();
  </script>

          // ???????????????????????????????????????????????????????????????
          var currentPath = window.location.pathname + window.location.search + window.location.hash;
          if (currentPath !== savedPath && savedPath !== '/index.html') {
            // ???????replaceState ????? URL?????????????????
            // ??????Flutter ??????????????????????? URL ?????????
            window.history.replaceState(null, '', savedPath);
            console.log('[404_REDIRECT] Path restored: restored=true');
          }
        }
      } catch (e) {
        console.error('[404_REDIRECT] Failed to restore path:', e && e.name || 'Error');
      }
    })();
  </script>
  
  <!-- OAuth ??????????????????????????????????????? -->
  <script>
    // Detect OAuth callback and update loading screen
    (function() {
      try {
        var urlParams = new URLSearchParams(window.location.search);
        var savedPath = sessionStorage.getItem('_404_redirect_path') || '';
        var isOAuth = urlParams.has('tokenId') || 
                     window.location.pathname.includes('/oauth2-callback') ||
                     savedPath.includes('tokenId=') ||
                     savedPath.includes('/oauth2-callback');
        
        if (isOAuth) {
          var loadingText = document.getElementById('loading-text');
          if (loadingText) loadingText.textContent = '\u6b63\u5728\u8655\u7406\u767b\u5165...';
        }
      } catch (e) {
        // Silent fail, don't block
      }
    })();
  </script>
  <script>
    // ?????????????? Flutter ??????
    window.registerMessageHandler = function(callback) {
      window._messageHandler = callback;
    };

    // ???????????Service Worker ?????
    window.handleServiceWorkerMessage = function(data) {
      if (window._messageHandler) {
        window._messageHandler(data);
      }
    };
  </script>
