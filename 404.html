<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA 路由支持
    // 将所有 404 请求重定向到 index.html，让 Flutter 路由系统处理
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // Pages is not a v2 callback origin. Do not copy a one-time proof into
      // sessionStorage or forward it through the generic SPA redirect.
      var fragment = hash.slice(1);
      var split = fragment.indexOf('?');
      var query = new URLSearchParams(search);
      var fragmentQuery = new URLSearchParams(split < 0 ? fragment : fragment.slice(split + 1));
      if (['webSessionVersion', 'bindingVersion', 'flowId', 'completionCode'].some(function (key) {
        return query.has(key) || fragmentQuery.has(key);
      })) {
        try { sessionStorage.removeItem('_404_redirect_path'); } catch (_) {}
        try { window.history.replaceState(null, '', '/oauth2-callback'); } catch (_) {}
        var binding = query.has('bindingVersion') || fragmentQuery.has('bindingVersion');
        window.location.replace('/index.html?' + (binding ? 'bindingVersion' : 'webSessionVersion') + '=2');
        return;
      }
      
      // 防止循环重定向：检查是否已经包含 /index.html
      if (path.indexOf('/index.html') !== -1) {
        // 如果路径已经包含 index.html，说明已经重定向过了
        // 提取原始路径（去掉 /index.html 前缀）
        var originalPath = path.replace(/\/index\.html/g, '');
        if (!originalPath) {
          originalPath = '/';
        }
        
        // 保存原始路径到 sessionStorage，供 Flutter 应用使用
        try {
          sessionStorage.setItem('_404_redirect_path', originalPath + search + hash);
        } catch (e) {
          console.error('Failed to save redirect path:', e);
        }
        
        // 直接重定向到 /index.html，不带任何路径
        window.location.replace('/index.html');
        return;
      }
      
      // 第一次访问：保存原始路径和查询参数
      try {
        var fullPath = path + search + hash;
        sessionStorage.setItem('_404_redirect_path', fullPath);
      } catch (e) {
        console.error('Failed to save redirect path:', e);
      }
      
      // 直接重定向到 /index.html（不带路径，避免循环）
      window.location.replace('/index.html');
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/index.html"></noscript>
</head>
<body>
  <p>Redirecting to <a href="/index.html">home page</a>...</p>
</body>
</html>
