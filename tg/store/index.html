<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="agora-frontend-sha" content="7494cfa8cfc85a737defdf8ff4ab1eeb8b53018a" />
  <title>AgoraMarket</title>
  <style>
    html, body {
      margin: 0; width: 100%; min-height: 100%;
      background: #0a0a0a;
      display: flex; align-items: center; justify-content: center;
      box-sizing: border-box;
    }
    p { color: #c0ccff; font-family: Arial, sans-serif; font-size: 14px; }
    .probe-panel {
      width: min(92vw, 760px);
      max-height: 90vh;
      overflow: auto;
      padding: 18px;
      border: 1px solid #2f3a5f;
      border-radius: 8px;
      background: #101624;
      color: #e5ecff;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      font-family: Arial, sans-serif;
    }
    .probe-panel h1 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 700;
    }
    .probe-panel p {
      margin: 0 0 14px;
      color: #aebbf2;
      line-height: 1.45;
    }
    .probe-panel pre {
      margin: 0;
      padding: 12px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      border-radius: 6px;
      background: #07101f;
      color: #e8f0ff;
      font-size: 12px;
      line-height: 1.45;
    }
    .probe-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .probe-actions button {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      background: #4068ff;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .probe-actions button.secondary {
      background: #27324d;
    }
  </style>
</head>
<body>
  <p id="status">AgoraMarket</p>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="./tg_store_routing.7494cfa8cfc8.js"></script>
  <script>
    (function () {
      var API_BASE = 'https://agoramarketapi.purrtechllc.com/api';
      var USDT_TELEMETRY_ENDPOINT =
        API_BASE + '/public/traffic/usdt-landing/events';
      var statusEl = document.getElementById('status');
      var startupStage = 'bootstrap';
      var englishDemoEntry = false;
      var frontendSha = (function () {
        try {
          var meta = document.querySelector('meta[name="agora-frontend-sha"]');
          var value = String((meta && meta.content) || '').trim();
          return /^[0-9a-f]{40}$/i.test(value) ? value.toLowerCase() : 'local';
        } catch (_) {
          return 'local';
        }
      })();
      function setStatus(t) { if (statusEl) statusEl.textContent = t; }
      function localizedStatus(zhHant, english) {
        return englishDemoEntry ? english : zhHant;
      }
      function safeErrorName(err) {
        try {
          var name = String((err && err.name) || 'UnknownError');
          return /^[A-Za-z][A-Za-z0-9_.-]{0,63}$/.test(name)
            ? name
            : 'UnknownError';
        } catch (_) {
          return 'UnknownError';
        }
      }
      function logStageError(level, stage, err) {
        try {
          var message = '[tg/store] stage=' + stage +
            ' errorType=' + safeErrorName(err) +
            ' frontendSha=' + frontendSha;
          if (level === 'warn') {
            console.warn(message);
          } else {
            console.error(message);
          }
        } catch (_) {}
      }
      function parseQuery(value) {
        var out = {};
        if (!value) return out;
        var search = String(value);
        if (search.charAt(0) === '?') search = search.slice(1);
        if (!search) return out;
        var params = new URLSearchParams(search);
        params.forEach(function (paramValue, key) {
          out[key] = paramValue;
        });
        return out;
      }
      function eventId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (token) {
          var random = Math.floor(Math.random() * 16);
          var value = token === 'x' ? random : (random & 0x3) | 0x8;
          return value.toString(16);
        });
      }
      function postStartappReceived(event, attempt) {
        return Promise.resolve().then(function () {
          return fetch(USDT_TELEMETRY_ENDPOINT, {
            method: 'POST',
            mode: 'cors',
            credentials: 'omit',
            cache: 'no-store',
            keepalive: true,
            headers: {
              Accept: 'application/json',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(event),
          });
        }).then(function (response) {
          if (!response.ok) throw new Error('telemetry status ' + response.status);
          return response.json();
        }).catch(function (err) {
          if (attempt >= 1) {
            logStageError('warn', 'startapp_telemetry', err);
            return null;
          }
          return new Promise(function (resolve) {
            setTimeout(function () {
              resolve(postStartappReceived(event, attempt + 1));
            }, 250);
          });
        });
      }
      function recordStartappReceived(routeTarget) {
        if (!routeTarget || routeTarget.probe) return Promise.resolve(null);
        try {
          var routing = window.TgStoreRouting;
          if (!routing || typeof routing.buildStartappReceivedEvent !== 'function') {
            logStageError('warn', 'startapp_event_builder', {
              name: 'LegacyRoutingApiError',
            });
            return Promise.resolve(null);
          }
          var event = routing.buildStartappReceivedEvent(
            routeTarget,
            eventId()
          );
          if (!event) return Promise.resolve(null);
          return Promise.resolve(postStartappReceived(event, 0)).catch(function (err) {
            logStageError('warn', 'startapp_telemetry', err);
            return null;
          });
        } catch (err) {
          logStageError('warn', 'startapp_event_builder', err);
          return Promise.resolve(null);
        }
      }
      function readInitDataSummary(initData) {
        var params = parseQuery(initData);
        return {
          present: Boolean(initData),
          hasHash: Boolean(params.hash),
          hasUser: Boolean(params.user),
          hasAuthDate: Boolean(params.auth_date),
        };
      }
      function buildProbeEvidence(routeTarget, tg, authBody, authResult) {
        var locationParams = parseQuery(window.location.search);
        return {
          capturedAt: new Date().toISOString(),
          source: 'tg-store-ref-probe',
          location: {
            searchKeys: Object.keys(locationParams).sort(),
            startapp: locationParams.startapp || '',
            tgWebAppStartParam: locationParams.tgWebAppStartParam || '',
          },
          telegramRuntime: {
            hasWebApp: Boolean(tg),
            initDataUnsafeStartParam: String((tg.initDataUnsafe || {}).start_param || ''),
            initDataSummary: readInitDataSummary(String(tg.initData || '')),
          },
          resolvedRoute: {
            route: routeTarget.route,
            ref: routeTarget.ref,
            referrerGroupId: routeTarget.referrerGroupId,
            targetPath: routeTarget.targetPath,
            hashTarget: routeTarget.hashTarget,
          },
          authRequest: {
            endpoint: '/api/auth/telegram-webapp/exchange-jwt',
            initData: '<redacted>',
            sentReferrerGroupId: Object.prototype.hasOwnProperty.call(authBody, 'referrerGroupId'),
            referrerGroupId: authBody.referrerGroupId == null ? null : authBody.referrerGroupId,
          },
          authResponse: authResult,
        };
      }
      function hasTelegramVersion(webApp, version) {
        try {
          return typeof webApp.isVersionAtLeast === 'function' &&
            webApp.isVersionAtLeast(version) === true;
        } catch (_) {
          return false;
        }
      }
      function isMobileTelegramWebApp(webApp) {
        try {
          var platform = String(webApp && webApp.platform || '').toLowerCase();
          if (platform === 'ios' || platform === 'android' || platform === 'android_x') {
            return true;
          }
          if (platform === 'tdesktop' || platform === 'weba' || platform === 'webk' ||
              platform === 'macos' || platform === 'windows' || platform === 'linux') {
            return false;
          }
        } catch (_) {}
        try {
          var ua = String(navigator.userAgent || '');
          if (/Android|iPhone|iPad|iPod|Mobile/i.test(ua)) return true;
        } catch (_) {}
        try {
          return window.matchMedia &&
            window.matchMedia('(pointer: coarse) and (max-width: 900px)').matches;
        } catch (_) {
          return false;
        }
      }
      function isTelegramDesktopWebApp(webApp) {
        try {
          var platform = String(webApp && webApp.platform || '').toLowerCase();
          if (platform === 'tdesktop' || platform === 'windows') return true;
          if (platform) return false;
        } catch (_) {}
        try {
          var ua = String(navigator.userAgent || '');
          return /TelegramDesktop/i.test(ua) ||
            (/Windows NT/i.test(ua) && /Edg\//i.test(ua));
        } catch (_) {
          return false;
        }
      }
      function persistHostSession(routeTarget, jwt, userId, userRole, themeMode) {
        try {
          localStorage.setItem('_tg_store_jwt', jwt);
          localStorage.setItem('_tg_store_uid', userId);
          localStorage.setItem('_tg_store_role', userRole);
          localStorage.setItem('_tg_store_target_path', routeTarget.targetPath);
          if (themeMode) {
            localStorage.setItem('_tg_store_theme', themeMode);
          } else {
            localStorage.removeItem('_tg_store_theme');
          }
          if (routeTarget.ref) {
            localStorage.setItem('_tg_store_ref', routeTarget.ref);
          } else {
            localStorage.removeItem('_tg_store_ref');
          }
          return true;
        } catch (err) {
          // Telegram Desktop may temporarily deny or reset origin storage.
          // The Flutter shell can still authenticate directly with initData,
          // so storage is an optimization and must never block storefront entry.
          logStageError('warn', 'session_storage', err);
          return false;
        }
      }
      async function resetTelegramDesktopRuntimeCache(webApp) {
        if (!isTelegramDesktopWebApp(webApp)) return;

        try {
          if (navigator.serviceWorker &&
              typeof navigator.serviceWorker.getRegistrations === 'function') {
            var registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          }
        } catch (err) {
          logStageError('warn', 'desktop_service_worker_reset', err);
        }

        try {
          if (window.caches && typeof window.caches.keys === 'function') {
            var cacheNames = await window.caches.keys();
            await Promise.all(cacheNames
              .filter(function (cacheName) { return /^agora-/i.test(cacheName); })
              .map(function (cacheName) { return window.caches.delete(cacheName); }));
          }
        } catch (err) {
          logStageError('warn', 'desktop_cache_reset', err);
        }
      }
      function redirectToStore(hashTarget) {
        try {
          window.location.replace(hashTarget);
          return;
        } catch (err) {
          logStageError('warn', 'store_redirect_replace', err);
        }

        try {
          window.location.assign(hashTarget);
          return;
        } catch (err) {
          logStageError('warn', 'store_redirect_assign', err);
        }

        // Last same-origin fallback for embedded WebViews that reject direct
        // location navigation but still allow history mutation + reload.
        window.history.replaceState(null, '', hashTarget);
        window.location.reload();
      }
      function requestTelegramViewport(webApp, reason) {
        try {
          if (!webApp) return;
          if (typeof webApp.ready === 'function') webApp.ready();
          if (typeof webApp.expand === 'function') webApp.expand();
          if (typeof webApp.disableVerticalSwipes === 'function') {
            webApp.disableVerticalSwipes();
          }
          if (isMobileTelegramWebApp(webApp) &&
              hasTelegramVersion(webApp, '8.0') &&
              typeof webApp.requestFullscreen === 'function') {
            webApp.requestFullscreen();
          }
          window.__agoraTelegramViewportRequested = reason;
        } catch (_) {}
      }
      function readTelegramThemeMode(webApp) {
        try {
          var colorScheme = String(webApp && webApp.colorScheme || '').trim().toLowerCase();
          if (colorScheme === 'dark' || colorScheme === 'light') return colorScheme;
        } catch (_) {}
        try {
          var params = (webApp && webApp.themeParams) || {};
          var bg = String(params.bg_color || params.secondary_bg_color || '').trim().toLowerCase();
          if (bg && /^#?[0-9a-f]{6}$/.test(bg)) {
            var hex = bg.charAt(0) === '#' ? bg.slice(1) : bg;
            var r = parseInt(hex.slice(0, 2), 16);
            var g = parseInt(hex.slice(2, 4), 16);
            var b = parseInt(hex.slice(4, 6), 16);
            var luminance = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
            return luminance < 0.5 ? 'dark' : 'light';
          }
        } catch (_) {}
        return '';
      }
      function showProbeEvidence(evidence, continueFn) {
        if (statusEl) statusEl.style.display = 'none';
        var panel = document.createElement('main');
        panel.className = 'probe-panel';
        var title = document.createElement('h1');
        title.textContent = 'TG Referrer Probe';
        var note = document.createElement('p');
        note.textContent = 'Sanitized runtime evidence. initData, JWT, bot tokens, and API keys are redacted.';
        var pre = document.createElement('pre');
        pre.textContent = JSON.stringify(evidence, null, 2);
        var actions = document.createElement('div');
        actions.className = 'probe-actions';
        var copy = document.createElement('button');
        copy.textContent = 'Copy Evidence';
        copy.onclick = async function () {
          try {
            await navigator.clipboard.writeText(pre.textContent);
            copy.textContent = 'Copied';
          } catch (_) {
            copy.textContent = 'Copy Failed';
          }
        };
        actions.appendChild(copy);
        if (typeof continueFn === 'function') {
          var next = document.createElement('button');
          next.className = 'secondary';
          next.textContent = 'Continue';
          next.onclick = continueFn;
          actions.appendChild(next);
        }
        panel.appendChild(title);
        panel.appendChild(note);
        panel.appendChild(pre);
        panel.appendChild(actions);
        document.body.innerHTML = '';
        document.body.appendChild(panel);
      }

      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) { setStatus('隢 Telegram 銝剝???); return; }
      englishDemoEntry = String((tg.initDataUnsafe || {}).start_param || '') === 'marketplace_demo_en';
      document.documentElement.lang = englishDemoEntry ? 'en' : 'zh-Hant';
      requestTelegramViewport(tg, 'tg-store-startup');
      setTimeout(function () { requestTelegramViewport(tg, 'tg-store-retry-250ms'); }, 250);
      setTimeout(function () { requestTelegramViewport(tg, 'tg-store-retry-900ms'); }, 900);

      var initData = String(tg.initData || '').trim();
      if (!initData) {
        setStatus(localizedStatus('?⊥??? Telegram 頨怠?鞈?', 'Unable to read Telegram identity'));
        return;
      }

      (async function () {
        try {
          startupStage = 'route_resolution';
          var routeTarget = window.TgStoreRouting.resolveTarget({
            search: window.location.search,
            initDataUnsafe: tg.initDataUnsafe || {},
          });
          englishDemoEntry = routeTarget.route === 'marketplace_demo_en';
          document.documentElement.lang = englishDemoEntry ? 'en' : 'zh-Hant';

          setStatus(localizedStatus('撽?頨怠?銝?..', 'Verifying your identity...'));
          startupStage = 'auth_exchange';
          var authBody = { initData: initData };
          if (routeTarget.referrerGroupId !== null) {
            authBody.referrerGroupId = routeTarget.referrerGroupId;
          }
          var authResult = { status: null, ok: false };
          var resp = await fetch(API_BASE + '/auth/telegram-webapp/exchange-jwt', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(authBody),
          });
          authResult.status = resp.status;
          authResult.ok = resp.ok;
          if (!resp.ok) {
            console.error('[tg/store] auth failed: endpoint=exchange-jwt status=' + resp.status);
            if (routeTarget.probe) {
              showProbeEvidence(buildProbeEvidence(routeTarget, tg, authBody, authResult), null);
              return;
            }
            setStatus(localizedStatus('?餃憭望?', 'Sign-in failed') + ' (' + resp.status + ')');
            return;
          }

          startupStage = 'auth_response';
          var json = await resp.json();
          var body = json.data != null ? json.data : json;
          var jwt = String(body.jwt || body.token || body.accessToken || '').trim();
          if (!jwt) {
            setStatus(localizedStatus('?餃憭望?嚗 token嚗?, 'Sign-in failed (missing token)'));
            return;
          }

          var userInfo = body.userInfo || body || {};
          var userId = String(userInfo.id || userInfo.userId || body.userId || '');
          var userRole = String(userInfo.role || body.role || 'USER').toUpperCase();
          authResult.tokenReceived = Boolean(jwt);
          authResult.responseUserIdPresent = Boolean(userId);
          authResult.role = userRole || 'USER';

          // ?? JWT ?舫??Flutter ??銝甈?token嚗 WebView storage
          // 銝?剁?Flutter 隞?隞?Telegram initData ?芸??餃??
          startupStage = 'session_storage';
          var themeMode = readTelegramThemeMode(tg);
          authResult.hostStoragePersisted = persistHostSession(
            routeTarget,
            jwt,
            userId,
            userRole,
            themeMode
          );

          setStatus(localizedStatus('?脣??銝?..', 'Opening the buyer store...'));
          startupStage = 'optional_startapp_telemetry';
          var startappTelemetry = recordStartappReceived(routeTarget);
          if (routeTarget.probe) {
            showProbeEvidence(
              buildProbeEvidence(routeTarget, tg, authBody, authResult),
              function () { redirectToStore(routeTarget.hashTarget); }
            );
            return;
          }
          startupStage = 'desktop_runtime_reset';
          await resetTelegramDesktopRuntimeCache(tg);
          startupStage = 'store_redirect';
          await Promise.race([
            startappTelemetry,
            new Promise(function (resolve) { setTimeout(resolve, 300); }),
          ]);
          redirectToStore(routeTarget.hashTarget);
        } catch (err) {
          logStageError('error', startupStage, err);
          setStatus(localizedStatus(
            '頛?航炊嚗? + startupStage + '嚗?隢?閰?,
            'Loading failed (' + startupStage + '). Please try again.'
          ));
        }
      })();
    })();
  </script>
</body>
</html>
